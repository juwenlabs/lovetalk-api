name: patch-v42-grounding-timing
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/trigger-v42-grounding-timing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v42 patch
        run: python .github/scripts/patch_v42_grounding_timing.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v42 to main
        run: |
          git config user.name "juwenlabs"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          git commit -m "Apply Potentia v42 grounding and timing guards"
          git push origin HEAD:main
