name: patch-v74-three-replies

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add v74 three replies workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v74 patch
        run: python .github/scripts/patch_v74_three_replies.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v74 and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-v74-three-replies.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/patch-v74-three-replies.yml
          git commit -m "Apply Potentia v74 three replies"
          git push origin HEAD:main
