name: patch-v55-vague-meeting-user-intent
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/trigger-v55-vague-meeting-user-intent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v55 patch
        run: python scripts/patch_v55_vague_meeting_user_intent.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v55 to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply Potentia v55 vague meeting user intent"
          git push origin HEAD:main
