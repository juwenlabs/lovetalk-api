name: patch-v33-round2
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v33 patch
        run: python .github/scripts/patch_v33_round2.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit patched server
        run: |
          git config user.name "somtok-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply Potentia v33 round2 quality guards"
          git push origin HEAD:main
