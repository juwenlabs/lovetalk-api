name: patch-v61-faster-pro

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add v61 faster PRO workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v61 patch
        run: python .github/scripts/patch_v61_faster_pro.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v61 and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-v61-faster-pro.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/patch-v61-faster-pro.yml
          git commit -m "Apply Potentia v61 faster PRO cache compact"
          git push origin HEAD:main
