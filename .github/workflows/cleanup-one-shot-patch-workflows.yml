name: cleanup-one-shot-patch-workflows
on:
  pull_request:
    branches: ["main"]
jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/cleanup-one-shot-patch-workflows'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify live server source version
        run: grep -F '2026-08-23-potentia-v57-no-send-detail-replies' server.js
      - name: Remove one-shot patch workflows
        run: |
          find .github/workflows -maxdepth 1 -type f -name 'patch-v*.yml' -print -delete
          rm -f .github/workflows/cleanup-one-shot-patch-workflows.yml
      - name: Commit workflow cleanup to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "Remove one-shot Potentia patch workflows"
          git push origin HEAD:main
