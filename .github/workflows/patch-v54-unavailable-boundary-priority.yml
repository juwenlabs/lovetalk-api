name: patch-v54-unavailable-boundary-priority
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/trigger-v54-unavailable-boundary-priority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v54 patch
        run: python scripts/patch_v54_unavailable_boundary_priority.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v54 to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply Potentia v54 unavailable boundary priority"
          git push origin HEAD:main
