name: patch-liveqa-server
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/patch-liveqa-server.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: |
          python .github/scripts/patch_liveqa_server.py
          node --check server.js
          git config user.name "Somtok QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          git commit -m "Fix live analysis parser and advanced starter safety"
          git push origin main
