name: patch-v48-pro-participation-balance
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/trigger-v48-pro-participation-balance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v48 patch
        run: python .github/scripts/patch_v48_pro_participation_balance.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v48 to main
        run: |
          git config user.name "juwenlabs"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          git commit -m "Apply Potentia v48 PRO participation balance"
          git push origin HEAD:main
