name: patch-v63-compact-pro-output

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add v63 compact PRO output workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v63 patch
        run: python .github/scripts/patch_v63_compact_pro_output.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v63 and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-v63-compact-pro-output.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/patch-v63-compact-pro-output.yml
          git commit -m "Apply Potentia v63 compact PRO output"
          git push origin HEAD:main
