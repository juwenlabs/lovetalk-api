name: patch-v60-fast-pro-grounding-polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add v60 PRO grounding polish workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v60 patch
        run: python .github/scripts/patch_v60_fast_pro_grounding_polish.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v60 and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-v60-fast-pro-grounding-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/patch-v60-fast-pro-grounding-polish.yml
          git commit -m "Apply Potentia v60 fast PRO grounding polish"
          git push origin HEAD:main
