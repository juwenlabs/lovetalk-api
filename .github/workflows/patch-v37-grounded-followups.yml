name: patch-v37-grounded-followups
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply v37 patch
        run: python .github/scripts/patch_v37_grounded_followups.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v37
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply Potentia v37 grounded follow-up fixes"
          git push origin main
