name: patch-v57-no-send-detail-replies
on:
  pull_request:
    branches: ["main"]
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/trigger-v57-no-send-detail-replies'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v57 patch
        run: python .github/scripts/patch_v57_no_send_detail_reply_cards.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v57 to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Apply Potentia v57 no-send detail reply cards"
          git push origin HEAD:main
