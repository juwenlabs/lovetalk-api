name: patch-v59-fast-pro-grounding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add v59 fast PRO grounding workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v59 patch
        run: python .github/scripts/patch_v59_fast_pro_grounding.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v59 and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-v59-fast-pro-grounding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/patch-v59-fast-pro-grounding.yml
          git commit -m "Apply Potentia v59 fast PRO grounding"
          git push origin HEAD:main
