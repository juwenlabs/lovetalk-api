name: patch-v41-retry
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/trigger-v41-availability-boundaries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fix patch replacement handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/patch_v41_availability_boundaries.py')
          s=p.read_text(encoding='utf-8')
          old='s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)'
          new='s2,n=re.subn(pattern,lambda m: replacement,s,count=1,flags=re.S)'
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply v41 patch
        run: python .github/scripts/patch_v41_availability_boundaries.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v41 to main
        run: |
          git config user.name "juwenlabs"
          git config user.email "actions@users.noreply.github.com"
          git add server.js .github/scripts/patch_v41_availability_boundaries.py
          git commit -m "Apply Potentia v41 availability and boundary guards"
          git push origin HEAD:main
