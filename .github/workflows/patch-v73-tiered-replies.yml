name: patch-v73-tiered-replies

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add v73 tiered replies workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v73 patch
        run: python .github/scripts/patch_v73_tiered_replies.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v73 and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-v73-tiered-replies.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/patch-v73-tiered-replies.yml
          git commit -m "Apply Potentia v73 tiered replies"
          git push origin HEAD:main
