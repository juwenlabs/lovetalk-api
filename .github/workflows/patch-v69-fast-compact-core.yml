name: patch-v69-fast-compact-core

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add v69 fast compact core workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v69 patch
        run: python .github/scripts/patch_v69_fast_compact_core.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v69 and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-v69-fast-compact-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/patch-v69-fast-compact-core.yml
          git commit -m "Apply Potentia v69 fast compact core"
          git push origin HEAD:main
