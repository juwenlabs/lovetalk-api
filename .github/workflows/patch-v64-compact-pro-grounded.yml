name: patch-v64-compact-pro-grounded

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add v64 compact PRO grounding workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v64 patch
        run: python .github/scripts/patch_v64_compact_pro_grounded.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v64 and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-v64-compact-pro-grounded.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/patch-v64-compact-pro-grounded.yml
          git commit -m "Apply Potentia v64 compact PRO grounded"
          git push origin HEAD:main
