name: patch-v45-detail-role-binding
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/trigger-v45-detail-role-binding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v45 patch
        run: python .github/scripts/patch_v45_detail_role_binding.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v45 to main
        run: |
          git config user.name "juwenlabs"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          git commit -m "Apply Potentia v45 detail role binding"
          git push origin HEAD:main
