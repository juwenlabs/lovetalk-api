name: patch-v49-priority-boundaries
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/trigger-v49-priority-boundaries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v49 patch
        run: python .github/scripts/patch_v49_priority_boundaries.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v49 to main
        run: |
          git config user.name "juwenlabs"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          git commit -m "Apply Potentia v49 priority boundaries"
          git push origin HEAD:main
