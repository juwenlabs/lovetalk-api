name: patch-v44-deterministic-edges
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/trigger-v44-deterministic-edges'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v44 patch
        run: python .github/scripts/patch_v44_deterministic_edges.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v44 to main
        run: |
          git config user.name "juwenlabs"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          git commit -m "Apply Potentia v44 deterministic edge guards"
          git push origin HEAD:main
