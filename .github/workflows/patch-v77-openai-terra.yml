name: patch-v77-openai-terra

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add v77 OpenAI Terra migration workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v77 migration
        run: python .github/scripts/patch_v77_openai_terra.py
      - name: Syntax check
        run: node --check server.js
      - name: Verify OpenAI adapter markers
        shell: bash
        run: |
          grep -q 'gpt-5.6-terra' server.js
          grep -q 'api.openai.com/v1/responses' server.js
          grep -q 'OPENAI_API_KEY' server.js
          ! grep -q 'new Anthropic' server.js
      - name: Commit v77 and cleanup workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-v77-openai-terra.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/patch-v77-openai-terra.yml
          git commit -m "Apply Potentia v77 OpenAI Terra"
          git push origin HEAD:main
