name: patch-v47-boundaries-followup-grounding
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/trigger-v47-boundaries-followup-grounding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v47 patch
        run: python .github/scripts/patch_v47_boundaries_followup_grounding.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v47 to main
        run: |
          git config user.name "juwenlabs"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          git commit -m "Apply Potentia v47 boundary and follow-up grounding"
          git push origin HEAD:main
