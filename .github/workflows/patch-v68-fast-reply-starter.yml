name: patch-v68-fast-reply-starter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add v68 fast reply starter workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v68 patch
        run: python .github/scripts/patch_v68_reply_starter_speed.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v68 and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-v68-fast-reply-starter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/patch-v68-fast-reply-starter.yml
          git commit -m "Apply Potentia v68 fast reply starter"
          git push origin HEAD:main
