name: patch-v76-reply-detail-safety

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add v76 reply detail safety workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v76 patch
        run: python .github/scripts/patch_v76_reply_detail_safety.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v76 and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-v76-reply-detail-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/patch-v76-reply-detail-safety.yml
          git commit -m "Apply Potentia v76 reply detail safety"
          git push origin HEAD:main
