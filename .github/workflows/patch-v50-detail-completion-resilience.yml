name: patch-v50-detail-completion-resilience
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/trigger-v50-detail-completion-resilience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v50 patch
        run: python .github/scripts/patch_v50_detail_completion_resilience.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v50 to main
        run: |
          git config user.name "juwenlabs"
          git config user.email "actions@users.noreply.github.com"
          git add server.js
          git commit -m "Apply Potentia v50 detail completion resilience"
          git push origin HEAD:main
