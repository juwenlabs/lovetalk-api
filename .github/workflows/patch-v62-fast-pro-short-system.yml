name: patch-v62-fast-pro-short-system

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add v62 fast PRO short-system workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v62 patch
        run: python .github/scripts/patch_v62_fast_pro_short_system.py
      - name: Syntax check
        run: node --check server.js
      - name: Commit v62 and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-v62-fast-pro-short-system.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/patch-v62-fast-pro-short-system.yml
          git commit -m "Apply Potentia v62 fast PRO short system"
          git push origin HEAD:main
